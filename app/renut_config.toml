# rr6-nx (Ridge Racer 6, title 4E4D07D3, XDK 2.0.2135) - ReXGlue codegen configuration.
# The project keeps banjo-nx's internal name "renut" (generated/renut_*.h, the renut / renut_recomp targets,
# out/renut_image.bin) so banjo-nx's CMake, post-codegen passes and renderer glue work unchanged; the NRO and the SD
# folder are rr6-nx (docs/rr6-notes.md, "Decisions").

includes = [
"config/renut_funcs.toml",
"config/renut_hooks.toml",
"overrides.toml",
]

# banjo-nx's optimised codegen keys that need no per-game audit (they change how the C++ is written, not what the
# guest sees; banjo-nx's renut_config.toml carries the reasoning and the console measurements for each):
cr_as_local = true
ctr_as_local = true
xer_as_local = true
reserved_as_local = true
skip_msr = true
dform_disp_split = true
fctiwz_inline = true
fcti_inline = true
dcbt_prefetch = true
rotate_word_shifts = true
fp_compares_modeless = true
fp_mode_lookahead = true
fp_mode_lookahead_past_branch = true
fp_copy_pairs = true
fp_copy_forwarding = true
div_inline = true
fp_moves_modeless = true

# The register "diet" keys (every codegen option banjo-nx uses), audited for this game (docs/rr6-notes.md, "Codegen
# options"). v64-v127 stay in ctx from the start (katamari-nx's rc3 finding: a codec keeps constants there across calls).
non_volatile_as_local = true
non_volatile_as_local_keep = ["v64-v127"]
elide_lr_stores = true
non_argument_as_local = true
# 46 ENTRY and 2 RET functions (tools/diet_keep_list.py, from tools/non_argument_audit.py).
non_argument_as_local_keep = [
    0x8224BA00, 0x8224BA28, 0x8224BCE4, 0x8224BD0C, 0x8224C57C, 0x8224C59C, 0x822C140C, 0x822C1484,
    0x822C1544, 0x8230D014, 0x8230D36C, 0x8230D38C, 0x8230E604, 0x8230E624, 0x8230E7EC, 0x8230E80C,
    0x8230EB1C, 0x8230EB3C, 0x8230ECFC, 0x8230ED1C, 0x8230F0D8, 0x8230F0F8, 0x8230F8E0, 0x8230F900,
    0x8230FDB0, 0x8230FDDC, 0x8230FEE4, 0x8230FF04, 0x82310254, 0x8231609C, 0x823160BC, 0x8231634C,
    0x8231636C, 0x82316974, 0x82316994, 0x82316BD8, 0x82316BF8, 0x82317128, 0x82317154, 0x82317758,
    0x82317778, 0x82317E64, 0x82317E84, 0x82318218, 0x82318238, 0x82318724, 0x8231B1E8, 0x8231B2B0,
]

# setjmp / longjmp: Ridge Racer 6 Recomp's manifest; checked by shape in this image (docs/rr6-notes.md).
setjmp_address = 0x8230E2F0
longjmp_address = 0x8230E1D0

project_name = "renut"
file_path = "assets/default.xex"
out_directory_path = "generated"

